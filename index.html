                                                {deletingBookingId === b.bookingId ? '刪除中...' : '刪除訂單'}
                                            </button>
                                        )}
                                        {b.status === "已完課" && <span className="text-xs text-gray-400 font-bold">已完課紀錄保留</span>}
                                    </div>
                                    {["審核中", "預約成功"].includes(b.status) && !b.bookingId && (
                                        <p className="mt-2 text-xs text-red-600">缺少訂單編號，請先補上唯一編號</p>
                                    )}
                                </td>
                              </tr>
                            )})}
                          </tbody>
                        </table>
                      </div>
                    </div>
                </div>
              </div>
              {/* 共用寫日誌彈窗 (傳入 targetData={lineId, name, bookingId}) */}
              {logModalTarget && <LogFormModal targetData={logModalTarget} onClose={() => setLogModalTarget(null)} onSuccess={fetchData} />}
            </div>
          );
        };

        const CoachMembersView = ({ onOpenStudent }) => {
            const [members, setMembers] = useState([]);
            const [viewModal, setViewModal] = useState({ isOpen: false, student: null });
            const [logModalTarget, setLogModalTarget] = useState(null); 

            const fetchMembers = () => {
                fetchAPI({ action: 'getCoachData' }).then(res => setMembers(res.members || []));
            };

            useEffect(() => { fetchMembers(); }, []);

            return (
                <div className="bg-white p-4 md:p-8 rounded-2xl shadow-sm border w-full overflow-hidden">
                    <h2 className="font-bold text-lg md:text-xl mb-5 border-b pb-3 text-slate-800">學員名單總覽</h2>
                    <div className="mobile-list-wrap overflow-x-auto">
                        <table className="mobile-card-table w-full min-w-max text-left text-sm md:text-base whitespace-nowrap">
                            <thead className="bg-gray-50 text-gray-600 border-b border-gray-200">
                                <tr>
                                    <th className="p-3 md:p-4">學員姓名</th>
                                    <th className="p-3 md:p-4">會員等級</th>
                                    <th className="p-3 md:p-4 text-center">累計完成堂數</th>
                                    <th className="p-3 md:p-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {!members || members.length === 0 ? (
                                    <tr><td colSpan="4" className="p-8 text-center text-gray-400">目前尚無會員資料</td></tr>
                                ) : (
                                    members.map((m, i) => (
                                        <tr key={i} className="border-b border-gray-100 hover:bg-gray-50 transition">
                                            <td data-label="學員姓名" className="p-3 md:p-4 font-bold text-base md:text-lg text-slate-800">{m.name}</td>
                                            <td data-label="會員等級" className="p-3 md:p-4">
                                                <span className="bg-amber-100 text-amber-800 text-xs md:text-sm font-bold px-3 py-1.5 rounded-md">{LEVEL_NAMES[m.level]}</span>
                                            </td>
                                            <td data-label="累計完成堂數" className="p-3 md:p-4 text-center font-extrabold text-slate-600 text-xl md:text-2xl">{m.totalClasses || 0}</td>
                                            <td data-label="操作" className="p-3 md:p-4 text-center">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => onOpenStudent(m)} disabled={!m.lineId} className="bg-slate-700 hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2.5 px-4 md:px-5 rounded-lg shadow-sm text-xs md:text-sm active:scale-95 transition">
                                                        開啟學生畫面
                                                    </button>
                                                    <button onClick={()=>setViewModal({isOpen: true, student: m})} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 md:px-5 rounded-lg shadow-sm text-xs md:text-sm active:scale-95 transition">
                                                        檢視資料
                                                    </button>
                                                    <button onClick={()=>setLogModalTarget({ lineId: m.lineId, name: m.name })} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 md:px-5 rounded-lg shadow-sm text-xs md:text-sm active:scale-95 transition">
                                                        補登日誌
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                    {viewModal.isOpen && <StudentDetailsModal student={viewModal.student} onClose={()=>setViewModal({isOpen: false, student: null})} />}
                    {logModalTarget && <LogFormModal targetData={logModalTarget} onClose={() => setLogModalTarget(null)} onSuccess={fetchMembers} />}
                </div>
            );
        };

        const CoachDashboard = () => {
            const [activeTab, setActiveTab] = useState('slots');
            const [selectedStudent, setSelectedStudent] = useState(null);

            if (selectedStudent) {
                return (
                    <div>
                        <div className="student-context sticky top-0 z-40 bg-amber-100 border-b border-amber-300 p-4 flex flex-wrap items-center justify-between gap-3" role="region" aria-label="教練學生畫面">
                            <div>
                                <p className="font-bold text-amber-950">目前操作學生：{selectedStudent.name}</p>
                                <p className="text-sm text-amber-900">教練檢視模式，預約將記錄在此學生名下。</p>
                            </div>
                            <button onClick={() => setSelectedStudent(null)} className="bg-slate-800 text-white font-bold px-4 py-2 rounded-lg">返回教練後台</button>
                        </div>
                        <StudentDashboard
                            key={selectedStudent.lineId}
                            profile={{ userId: selectedStudent.lineId, displayName: selectedStudent.name }}
                            userRecord={selectedStudent}
                        />
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto min-h-screen flex flex-col bg-gray-50 md:shadow-lg md:rounded-b-2xl">
                    <div className="bg-slate-800 p-4 md:p-8 pb-0 text-white shadow-md relative z-10">
                        <div className="flex items-center gap-4 mb-5">
                            <img src="./ll.png" alt="樂動羽球" className="w-10 h-10 md:w-14 md:h-14 rounded-full bg-white p-0.5 object-cover" />
                            <h1 className="text-xl md:text-3xl font-bold tracking-wider">教練管理後台</h1>
                        </div>
                        <div className="flex w-full mt-2 border-b border-slate-600">
                            <button onClick={()=>setActiveTab('slots')} className={`flex-1 min-w-0 md:flex-none md:w-48 px-1 py-3 text-sm md:text-base font-bold border-b-4 text-center transition-colors ${activeTab === 'slots' ? 'border-emerald-400 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>排課與預約管理</button>
                            <button onClick={()=>setActiveTab('members')} className={`flex-1 min-w-0 md:flex-none md:w-48 px-1 py-3 text-sm md:text-base font-bold border-b-4 text-center transition-colors ${activeTab === 'members' ? 'border-emerald-400 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>學員名單與資料</button>
                        </div>
                    </div>
                    <div className="flex-1 min-w-0 p-3 md:p-8">
                        {activeTab === 'slots' ? <CoachSlotsView /> : <CoachMembersView onOpenStudent={setSelectedStudent} />}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 🔹 應用程式掛載入口
        // ==========================================
        const App = () => {
          const [liffState, setLiffState] = useState({ init: false, profile: null });
          const [userRecord, setUserRecord] = useState(null);
          const [view, setView] = useState('loading');

          useEffect(() => {
            liff.init({ liffId: LIFF_ID }).then(() => {
              if (!liff.isLoggedIn()) liff.login();
              else {
                liff.getProfile().then(profile => {
                  setLiffState({ init: true, profile });
                  checkUser(profile.userId);
                });
              }
            }).catch(() => {
              const mockProfile = { userId: 'U12345678', displayName: '測試用戶' };
              setLiffState({ init: true, profile: mockProfile });
              checkUser(mockProfile.userId);
            });
          }, []);

          const checkUser = async (lineId) => {
            const res = await fetchAPI({ action: 'checkUser', lineId });
            if (res.isAdmin) setView('coach');
            else if (res.isRegistered) { setUserRecord(res.user); setView('student'); } 
            else setView('register');
          };

          if (view === 'loading') return <div className="p-10 text-center text-gray-500 font-bold animate-pulse">系統載入中...</div>;
          if (view === 'register') return <RegisterView profile={liffState.profile} onRegistered={(u) => { setUserRecord(u); setView('student'); }} />;
          if (view === 'student') return <StudentDashboard profile={liffState.profile} userRecord={userRecord} />;
          if (view === 'coach') return <CoachDashboard />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
