<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>&#x6a02;&#x52d5;&#x7fbd;&#x7403;</title>
    <link rel="icon" href="./ll.png" type="ll/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./ja.js?v=unicode-text-1"></script>
    <script src="./i18n.js?v=unicode-text-1"></script>
    <style>
        .language-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .language-switch-row > :first-child { min-width: 0; }
        .language-switch { display: flex; align-items: center; flex-shrink: 0; gap: 2px; }
        .language-switch button { min-height: 24px; padding: 2px 4px; border-radius: 0; border: 0; background: transparent; color: #64748b; font-size: 11px; line-height: 20px; font-weight: 400; white-space: nowrap; }
        .language-switch button[aria-pressed="true"] { color: #475569; }
        .language-switch button:hover { color: #334155; }
        html[lang="ja"] { overflow-wrap: anywhere; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; overflow-wrap: anywhere; }
        button, input, select, textarea { touch-action: manipulation; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid #059669;
            outline-offset: 3px;
        }
        @media (max-width: 767px) {
            body { padding-bottom: env(safe-area-inset-bottom); }
            #root { width: 100%; min-width: 0; }
            #root .flex > *, #root .grid > * { min-width: 0; }
            input[type="range"] { width: 100%; min-width: 0; max-width: 100%; }
            input[type="date"] { width: 100%; min-width: 0; }
            input[type="date"]::-webkit-date-and-time-value { min-width: 0; text-align: left; }
            input[type="date"]::-webkit-datetime-edit { min-width: 0; padding: 0; }
            button { min-height: 44px; }
            input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
                font-size: 16px !important;
                min-height: 44px;
                max-width: 100%;
                min-width: 0;
            }
            .mobile-list-wrap { max-height: none !important; overflow: visible !important; }
            .mobile-card-table { display: block; min-width: 0 !important; white-space: normal !important; }
            .mobile-card-table thead {
                position: absolute; width: 1px; height: 1px; padding: 0;
                overflow: hidden; clip-path: inset(50%); white-space: nowrap;
            }
            .mobile-card-table tbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .mobile-card-table tbody tr {
                display: block; min-width: 0; padding: 12px;
                border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
            }
            .mobile-card-table td {
                display: block; padding: 8px 0; text-align: left;
                white-space: normal; overflow-wrap: anywhere;
            }
            .mobile-card-table td[data-label]::before {
                content: attr(data-label); display: block; margin-bottom: 4px;
                font-size: 12px; font-weight: 600; color: #64748b;
            }
            .mobile-card-table td[data-label="\64cd \4f5c "] > div {
                display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
            }
            .mobile-card-table td[data-label="\64cd \4f5c "] button { width: 100%; white-space: normal; }
            .student-context { position: relative; z-index: auto; }
        }
        @media (min-width: 768px) {
            .registration-shell { width: calc(100% - 48px); max-width: 896px; margin: 24px auto; }
            .booking-layout > *, .coach-workspace > *, .records-detail-grid > * { min-width: 0; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .booking-layout { flex-direction: column; gap: 24px; padding: 24px; }
            .booking-calendar { width: 100%; max-width: 440px; margin: 0 auto; position: static; }
            .booking-slots { width: 100%; }
            .coach-workspace { grid-template-columns: minmax(0, 1fr); }
            .coach-results { grid-column: auto; }
        }
        @media (min-width: 1024px) {
            .student-shell, .coach-shell { width: calc(100% - 64px); max-width: 1440px; margin: 24px auto; min-height: calc(100vh - 48px); border-radius: 16px; }
            .student-shell { overflow: clip; }
            .dashboard-header { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); align-items: center; gap: 40px; padding: 24px 32px; }
            .dashboard-header > .brand-banner { border-radius: 12px; }
            .dashboard-header > .dashboard-heading { min-width: 0; padding: 0; }
            .student-content { overflow: visible; }
            .booking-notice { margin: 24px 32px 0; padding: 16px 20px; }
            .booking-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; padding: 24px 32px 32px; }
            .booking-calendar { width: auto; padding: 20px 16px; top: 24px; }
            .booking-calendar > :first-child { padding-left: 0; padding-right: 0; }
            .booking-slots { width: auto; padding: 0; }
            .coach-lesson-options { flex-direction: column; }
            .booking-confirmation { max-width: 640px; }
            .tracking-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; align-items: start; }
            .tracking-groups > :not([hidden]) ~ :not([hidden]) { margin-top: 0; }
            .records-view { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
            .records-view > label, .records-view > .monthly-leave-summary { grid-column: 1 / -1; margin-bottom: 0; }
            .records-total { margin-bottom: 0; }
            .records-detail-grid { grid-template-columns: minmax(0, 1fr); }
            .registration-shell { max-width: 1120px; padding: 32px 40px; }
            .registration-heading { display: grid; grid-template-columns: 320px minmax(0, 1fr); column-gap: 40px; align-items: center; }
            .registration-heading > .brand-banner { grid-row: 1 / 3; border-radius: 12px; }
            .registration-heading > .language-switch-row { margin-top: 0; align-self: end; }
            .registration-heading > p { align-self: start; }
            .registration-form > label { max-width: 280px; }
            .registration-form > .registration-student { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding: 24px; }
            .registration-form > .registration-student > :not(legend) { min-width: 0; margin-top: 0; }
            .registration-student > .registration-goals, .registration-student > .registration-style { grid-column: 1 / -1; }
            .registration-style { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
            .registration-style > p { grid-column: 1 / -1; }
            .registration-student > .registration-style > :not([hidden]) ~ :not([hidden]) { margin-top: 0; }
            .registration-form > button { max-width: 320px; margin-left: auto; display: block; }
            .coach-workspace { grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); gap: 24px; align-items: start; }
            .coach-monthly-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; align-items: start; }
            .coach-monthly-form > :not([hidden]) ~ :not([hidden]) { margin-top: 0; }
            .coach-monthly-form > label { grid-row: 1; min-width: 0; }
            .coach-monthly-form > fieldset, .coach-monthly-form > p { grid-column: 1 / -1; }
            .coach-monthly-form > button { grid-column: 1 / -1; justify-self: end; }
            .coach-editor { padding: 24px; }
            .coach-results { grid-column: auto; }
            .coach-shell .mobile-card-table { min-width: 680px; width: 100%; font-size: 14px; }
            .coach-shell .mobile-card-table th, .coach-shell .mobile-card-table td { padding: 12px; white-space: normal; overflow-wrap: anywhere; }
            .login-panel { max-width: 640px; min-height: 0; margin-top: 64px; padding: 32px; border-radius: 16px; }
        }
        @media (min-width: 1280px) {
            .records-detail-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
            .coach-lesson-options { flex-direction: row; }
            .coach-workspace { grid-template-columns: 360px minmax(0, 1fr); }
        }
    </style>
</head>
<body class="bg-gray-200 md:bg-gray-300 min-h-screen text-gray-800 selection:bg-emerald-200">
    <div id="root"></div>

    <script type="text/babel" src="./script.js?v=unicode-text-1"></script>
</body>
</html>
